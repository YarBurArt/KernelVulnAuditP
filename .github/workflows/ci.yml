name: CI-micro

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          severity: "medium"
          confidence: "medium"
          exclude: ".venv,venv,.git,__pycache__,tests,tests_integration,migrations,lib_tools,assets,config.py"
          targets: "."
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for pycairo (gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev \
            cmake
          sudo apt-get clean

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run pylint
        run: |
          FILES=$(git ls-files '*.py' \
            ':!.venv/**' \
            ':!venv/**' \
            ':!tests/**' \
            ':!tests_integration/**' \
            ':!migrations/**' \
            ':!lib_tools/**' \
            ':!assets/**' \
            ':!config.py')
            
          OUTPUT=$(uv run --frozen env PYTHONPATH=../ pylint \
            --disable=E1136,E1101,E1102,E1123,E1121 \
            $FILES) || echo "$?" > rc.txt
            
          echo "$OUTPUT"
          echo "$OUTPUT" > output.txt

      - name: Check code rating > 6.0
        run: |
          RATING=$(grep "Your code has been rated at" output.txt \
            | sed -E 's/.*rated at (-?[0-9]+(\.[0-9]+)?).*/\1/')
          echo "Rating is $RATING"
          awk -v r="$RATING" 'BEGIN { exit (r < 6.0) }'
