[project]
name = "kernelvulnauditp"
version = "0.1.1"
description = "This tool checks the practical functionality of linux kernel exploits"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "sqlalchemy==2.0.52",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "pyyaml>=6.0.0",
    "anyio==4.14.2",
    "dishka>=1.10.1",
]

[project.optional-dependencies]
streamlit = [
    "streamlit==1.61.1",
]
profiling = [
    "scalene>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: real environment tests (qemu, virtme-ng, network)"]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "bandit>=1.9.4",
    "pytest==9.1.1",
    "pylint>=4.0.7",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
    "coverage>=7.15.4",
    "pre-commit>=4.6.2",
]

[tool.mypy]
# report.py is a thin entry shim that deliberately shares the package name;
# lib_tools is vendored third-party tooling (peas2json) kept untyped.
exclude = "^report\\.py$|^lib_tools/"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]  # enable SAST like checks
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests_integration/**/*.py" = ["S101"]
# Tests only run hard-coded commands with checks
"tests/**" = ["S603", "S604"]
"tests_integration/**" = ["S603", "S604"]
# GUI report controller launches a static local streamlit instance
"gui/features/report_controller.py" = ["S603"]
# recon tools run only system utilities with static flags
"recon/local_target_recon.py" = ["S603"]
"recon/parse_recon_reports.py" = ["S603"]
# prototype helpers that run uname/file with zero external input
"prototype.py" = ["S603"]

