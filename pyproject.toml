[project]
name = "kernelvulnauditp"
version = "0.1.1"
description = "This tool checks the practical functionality of linux kernel exploits"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "sqlalchemy==2.0.52",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "pyyaml>=6.0.0",
    "anyio==4.14.2",
]

[project.optional-dependencies]
streamlit = [
    "streamlit==1.61.1",
]
profiling = [
    "scalene>=2.3.0",
]

[tool.pytest.ini_options]
markers = ["integration: real environment tests (qemu, virtme-ng, network)"]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "bandit>=1.9.4",
    "pytest==9.1.1",
    "pylint>=4.0.7",
    "black>=26.5.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
    "coverage>=7.15.4",
]

[tool.mypy]
# report.py is a thin entry shim that deliberately shares the package name
exclude = "^report\\.py$"

