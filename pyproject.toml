[project]
name = "kernelvulnauditp"
version = "0.1.1"
description = "This tool checks the practical functionality of linux kernel exploits"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pycairo>=1.29.0",
    "pygobject>=3.56.3",
    "sqlalchemy==2.0.51",
    "streamlit==1.60.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "bandit>=1.9.4",
    "pytest==9.1.1",
    "pylint>=4.0.6",
    "black>=26.5.1",
    "pygobject-stubs>=2.17.0",
    "ruff>=0.16.1",
]

