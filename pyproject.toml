dependencies = [
    "flet==0.86.2",
    "flet-desktop==0.86.2",
    "httpx>=0.28.1",
    "sqlalchemy==2.0.51",
    "streamlit==1.60.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "bandit>=1.9.4",
    "pytest==9.1.1",
    "pylint>=4.0.6",
    "black>=26.5.1",
]

